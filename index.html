<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>현장대장 — 전기업체 전용 현장·회사관리</title>
<meta name="description" content="현장 기록부터 견적·정산까지. 전기업체 운영에 필요한 기록을 한 화면에서 관리하세요.">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  /* 토스 계열 무채색 중심 팔레트 */
  --ink:#191F28;        /* 헤드라인 */
  --ink2:#4E5968;       /* 본문 */
  --gray:#8B95A1;       /* 보조 */
  --line:#E5E8EB;
  --bg:#FFFFFF;
  --bg2:#F9FAFB;
  --blue:#3182F6;
  --blue-d:#1B64DA;
  --sans:'Pretendard Variable','Pretendard',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic','Segoe UI',sans-serif;
  --wrap:1200px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:var(--sans);color:var(--ink);background:var(--bg);line-height:1.6;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
img{max-width:100%;display:block}
a{text-decoration:none;color:inherit}
.wrap{max-width:var(--wrap);margin:0 auto;padding:0 28px}

/* ───────── 헤더 : 히어로 위에 투명하게 얹고, 스크롤하면 흰색으로 ───────── */
header{position:fixed;top:0;left:0;right:0;z-index:80;transition:background .25s ease, box-shadow .25s ease, border-color .25s ease;border-bottom:1px solid transparent}
.nav{display:flex;align-items:center;justify-content:space-between;height:72px;gap:20px;white-space:nowrap}
.logo{display:flex;align-items:center;gap:9px;flex-shrink:0}
.logo img{height:34px;width:auto}
.logo b{font-weight:700;font-size:19px;letter-spacing:-.03em}
.nav-links{display:flex;gap:32px}
.nav-links a{font-weight:600;font-size:15px;opacity:.92;transition:opacity .15s}
.nav-links a:hover{opacity:1}
.nav-right{display:flex;align-items:center;gap:6px;flex-shrink:0}
.nav-right .login{font-weight:600;font-size:15px;padding:10px 14px;opacity:.92}
.nav-btn{font-weight:700;font-size:15px;padding:11px 20px;border-radius:10px;transition:background .2s, color .2s, border-color .2s}

/* 히어로 위(=투명) 상태 : 흰 글씨 */
header .logo b, header .nav-links a, header .nav-right .login{color:#fff}
header .logo img{filter:brightness(0) invert(1)}
header .nav-btn{background:#fff;color:var(--ink)}
header .nav-btn:hover{background:rgba(255,255,255,.86)}

/* 스크롤 후 : 흰 배경 + 검은 글씨 */
header.solid{background:rgba(255,255,255,.88);backdrop-filter:saturate(180%) blur(14px);border-bottom-color:var(--line)}
header.solid .logo b, header.solid .nav-links a, header.solid .nav-right .login{color:var(--ink)}
header.solid .logo img{filter:none}
header.solid .nav-btn{background:var(--ink);color:#fff}
header.solid .nav-btn:hover{background:#000}

/* ───────── 히어로 : 풀블리드 사진 + 하단 대형 타이포 ───────── */
.hero{position:relative;height:100svh;min-height:600px;max-height:940px;overflow:hidden;background:#2A2E33}
.hero-bg{position:absolute;inset:0}
.hero-bg img{width:100%;height:100%;object-fit:cover;object-position:center 42%}
/* 위: 헤더 가독성 / 아래: 헤드라인 가독성 */
.hero-bg::after{content:'';position:absolute;inset:0;
  background:linear-gradient(to bottom,rgba(10,14,20,.46) 0%,rgba(10,14,20,.12) 24%,rgba(10,14,20,.10) 40%,rgba(10,14,20,.58) 66%,rgba(10,14,20,.86) 100%)}

.hero-inner{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;justify-content:flex-end;padding-bottom:clamp(56px,9vh,104px)}
.hero h1{
  color:#fff;font-weight:700;letter-spacing:-.05em;line-height:1.14;
  font-size:clamp(30px,4.1vw,54px);
  display:flex;flex-wrap:nowrap;justify-content:space-between;align-items:baseline;gap:.6em;
  text-shadow:0 2px 26px rgba(0,0,0,.42)}
.hero h1 span{display:block;flex-shrink:0}
.hero-sub{margin-top:26px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.hero-sub p{color:rgba(255,255,255,.92);font-size:clamp(15px,1.5vw,18px);font-weight:500;letter-spacing:-.02em;text-shadow:0 1px 14px rgba(0,0,0,.5)}

/* 스크롤 유도 */
.scroll-cue{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);z-index:3;width:22px;height:34px;border:1.5px solid rgba(255,255,255,.55);border-radius:12px}
.scroll-cue i{position:absolute;left:50%;top:7px;width:3px;height:7px;margin-left:-1.5px;background:rgba(255,255,255,.9);border-radius:2px;animation:cue 1.7s ease-in-out infinite}
@keyframes cue{0%{transform:translateY(0);opacity:1}70%{transform:translateY(11px);opacity:0}100%{opacity:0}}

/* ───────── 히어로 다음 (여백 확인용 임시) ───────── */
.pause{padding:clamp(120px,18vh,220px) 0;text-align:center;background:#fff}
.pause h2{font-size:clamp(26px,3.8vw,46px);font-weight:700;letter-spacing:-.04em;line-height:1.32}
.pause .muted{color:var(--gray)}

@media(max-width:1080px){
  .hero h1{font-size:clamp(28px,3.9vw,44px);gap:.5em}
}
@media(max-width:860px){
  .wrap{padding:0 20px}
  .nav-links{display:none}
  .nav{height:64px}
  .nav-right .login{display:none}
  .nav-btn{font-size:14px;padding:10px 16px}
  .logo img{height:30px}
  .logo b{font-size:17px}
  .hero h1{display:block;font-size:clamp(30px,8.6vw,46px);line-height:1.2;letter-spacing:-.045em}
  .hero h1 span+span{margin-top:.06em}
  .hero-bg img{object-position:32% 38%}
  .hero-inner{padding-bottom:76px}
}
</style>
</head>
<body>

<header id="hdr"><div class="wrap nav">
  <div class="logo"><img src="img/logo.png" alt="현장대장 로고"><b>현장대장</b></div>
  <nav class="nav-links">
    <a href="#features">기능</a><a href="#screens">화면</a><a href="#story">이야기</a><a href="#beta">문의</a>
  </nav>
  <div class="nav-right">
    <a class="login" href="#">로그인</a>
    <a class="nav-btn" href="#beta">무료 베타 신청</a>
  </div>
</div></header>

<section class="hero">
  <div class="hero-bg"><img src="img/hero.jpg" alt="전기공사 현장에서 작업 중인 모습"></div>
  <div class="wrap hero-inner">
    <h1>
      <span>현장 기록도</span>
      <span>견적·정산도</span>
      <span>현장대장 하나로</span>
    </h1>
    <div class="hero-sub">
      <p>전기업체 운영에 필요한 모든 기록을, 한 화면에서.</p>
    </div>
  </div>
  <div class="scroll-cue"><i></i></div>
</section>

<section class="pause">
  <div class="wrap">
    <h2>여기부터 다음 섹션이<br>이어집니다</h2>
    <p class="muted" style="margin-top:14px">(히어로 확인용 임시 영역)</p>
  </div>
</section>

<script>
var hdr=document.getElementById('hdr');
function onScroll(){ hdr.classList.toggle('solid', window.scrollY > window.innerHeight*0.72); }
onScroll(); window.addEventListener('scroll',onScroll,{passive:true});
</script>
</body>
</html>
